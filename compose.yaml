services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: apps/server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /data/gen-mod.sqlite
    volumes:
      - server-data:/data
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
